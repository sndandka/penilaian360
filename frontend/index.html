<!DOCTYPE html>
<html lang="id">

<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Penilaian 360° DPU Bina Marga Jawa Timur</title>
    <meta name="description"
        content="Portal Login Resmi Sistem Penilaian Kinerja 360 Derajat Dinas Pekerjaan Umum Bina Marga Provinsi Jawa Timur.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function () {
            var t = localStorage.getItem('app_theme');
            if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="stylesheet" href="assets/css/style.css?v=20261125_login_fix">
    <style>
        :root {

            --gov-blue-dark: #0A192F;
            --gov-blue-primary: #1B4F8C;
            --gov-blue-light: #EBF3FA;
            --gov-gold: #C9A227;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #09192E 0%, #123A68 50%, #1B4F8C 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1E293B;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow & Grid */
        .login-bg-decor {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .login-bg-circle-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(27, 79, 140, 0.45) 0%, rgba(27, 79, 140, 0) 70%);
            top: -150px;
            right: -100px;
        }

        .login-bg-circle-2 {
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(201, 162, 39, 0.2) 0%, rgba(201, 162, 39, 0) 70%);
            bottom: -150px;
            left: -100px;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            padding: 24px 20px;
            position: relative;
            z-index: 1;
            box-sizing: border-box;
        }

        .login-card-pro {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.1);
            padding: 40px 36px 32px 36px;
            box-sizing: border-box;
            position: relative;
        }

        .login-brand-header {
            text-align: center;
            margin-bottom: 26px;
        }

        .login-brand-logo {
            width: 68px;
            height: 68px;
            margin: 0 auto 14px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.08));
        }

        .login-brand-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .login-brand-title {
            font-size: 22px;
            font-weight: 800;
            color: #0F2D59;
            margin: 0 0 6px 0;
            letter-spacing: -0.3px;
        }

        .login-brand-subtitle {
            font-size: 13px;
            font-weight: 500;
            color: #64748B;
            line-height: 1.45;
            margin: 0;
        }

        .login-divider-pill {
            width: 48px;
            height: 3px;
            background: linear-gradient(90deg, #1B4F8C, #C9A227);
            border-radius: 3px;
            margin: 14px auto 0 auto;
        }

        .input-group-custom {
            margin-bottom: 18px;
        }

        .input-group-custom label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 7px;
        }

        .input-icon-wrapper {
            position: relative !important;
            display: block !important;
            width: 100% !important;
            box-sizing: border-box !important;
        }

        .input-icon-wrapper .icon-left {
            position: absolute !important;
            left: 14px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            width: 18px !important;
            height: 18px !important;
            fill: #94A3B8;
            pointer-events: none !important;
            transition: fill 0.2s ease;
            z-index: 10 !important;
            margin: 0 !important;
            display: block !important;
        }

        .input-icon-wrapper input {
            display: block !important;
            width: 100% !important;
            height: 48px !important;
            line-height: 24px !important;
            padding: 11px 14px 11px 44px !important;
            margin: 0 !important;
            border: 1.5px solid #CBD5E1;
            border-radius: 10px;
            font-size: 14px;
            color: #1E293B;
            background: #F8FAFC;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            box-sizing: border-box !important;
            outline: none;
            font-family: inherit;
        }

        .input-icon-wrapper input[type="password"] {
            padding-right: 46px !important;
        }

        [data-theme="dark"] .input-icon-wrapper input {
            background: #0E162A !important;
            border-color: #23314D !important;
            color: #F8FAFC !important;
        }

        .input-icon-wrapper input:focus {
            background: #ffffff !important;
            border-color: #1B4F8C !important;
            box-shadow: 0 0 0 3.5px rgba(27, 79, 140, 0.12) !important;
        }

        [data-theme="dark"] .input-icon-wrapper input:focus {
            background: #141D33 !important;
            border-color: #3B82F6 !important;
            box-shadow: 0 0 0 3.5px rgba(59, 130, 246, 0.2) !important;
        }

        .input-icon-wrapper:focus-within .icon-left {
            fill: #1B4F8C !important;
        }

        [data-theme="dark"] .input-icon-wrapper:focus-within .icon-left {
            fill: #3B82F6 !important;
        }

        /* Cegah Browser Autofill (Edge / Chrome) Merusak Tata Letak & Warna */
        .input-icon-wrapper input:-webkit-autofill,
        .input-icon-wrapper input:-webkit-autofill:hover, 
        .input-icon-wrapper input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px #F8FAFC inset !important;
            -webkit-text-fill-color: #1E293B !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        [data-theme="dark"] .input-icon-wrapper input:-webkit-autofill,
        [data-theme="dark"] .input-icon-wrapper input:-webkit-autofill:hover, 
        [data-theme="dark"] .input-icon-wrapper input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 1000px #0E162A inset !important;
            -webkit-text-fill-color: #F8FAFC !important;
        }

        .btn-toggle-pwd {
            position: absolute !important;
            right: 12px !important;
            top: 50% !important;
            transform: translateY(-50%) !important;
            width: 32px !important;
            height: 32px !important;
            background: none;
            border: none;
            padding: 0 !important;
            cursor: pointer;
            color: #94A3B8;
            display: flex !important;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.15s, background 0.15s;
            z-index: 10 !important;
            margin: 0 !important;
        }

        .btn-toggle-pwd:hover {
            color: #1E293B;
            background: #EDF2F7;
        }

        [data-theme="dark"] .btn-toggle-pwd:hover {
            color: #F8FAFC;
            background: #23314D;
        }

        .btn-login-submit {
            width: 100%;
            height: 48px;
            margin-top: 10px;
            background: linear-gradient(135deg, #1B4F8C 0%, #123A68 100%);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(27, 79, 140, 0.25);
            font-family: inherit;
        }

        .btn-login-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(27, 79, 140, 0.35);
        }

        .btn-login-submit:active {
            transform: translateY(0);
        }

        .btn-login-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .login-card-footer {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px solid #E2E8F0;
            text-align: center;
        }

        .login-back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #475569;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.15s, transform 0.15s;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .login-back-link:hover {
            color: #1B4F8C;
            background: #F1F5F9;
            transform: translateX(-2px);
        }

        .login-app-note {
            margin-top: 14px;
            font-size: 11px;
            color: #94A3B8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .login-app-note svg {
            width: 12px;
            height: 12px;
            fill: #94A3B8;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 16px 14px;
            }
            .login-card-pro {
                padding: 28px 20px 24px 20px;
                border-radius: 16px;
            }
            .login-brand-logo {
                width: 56px;
                height: 56px;
                margin-bottom: 10px;
            }
            .login-brand-title {
                font-size: 19px;
            }
            .login-theme-toggle {
                top: 12px;
                right: 12px;
            }
        }
    </style>
</head>

<body>
    <button class="login-theme-toggle" id="theme-toggle" onclick="toggleThemeLogin()" type="button" title="Ubah Tema"
        aria-label="Ubah Tema"></button>
    <div class="login-bg-decor">
        <div class="login-bg-circle-1"></div>
        <div class="login-bg-circle-2"></div>
    </div>

    <div class="login-container">
        <div class="login-card-pro">
            <div class="login-brand-header">
                <div class="login-brand-logo">
                    <img src="assets/logo/OIP.webp" alt="Logo Pemprov Jatim" onerror="this.src='assets/logo/OIP.png'">
                </div>
                <h1 class="login-brand-title">Sistem Penilaian 360°</h1>
                <p class="login-brand-subtitle">Dinas Pekerjaan Umum Bina Marga<br>Provinsi Jawa Timur</p>
                <div class="login-divider-pill"></div>
            </div>

            <div id="alert-box"></div>

            <form id="login-form">
                <div class="input-group-custom">
                    <label for="username">Username / NIP</label>
                    <div class="input-icon-wrapper">
                        <svg class="icon-left" viewBox="0 0 24 24">
                            <path
                                d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z" />
                        </svg>
                        <input type="text" id="username" required autocomplete="username"
                            placeholder="Masukkan Username atau NIP">
                    </div>
                </div>

                <div class="input-group-custom">
                    <label for="password">Password</label>
                    <div class="input-icon-wrapper">
                        <svg class="icon-left" viewBox="0 0 24 24">
                            <path
                                d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z" />
                        </svg>
                        <input type="password" id="password" required autocomplete="current-password"
                            placeholder="Masukkan password">
                        <button type="button" class="btn-toggle-pwd" onclick="togglePasswordVisibility()"
                            title="Lihat / Sembunyikan Password" id="btn-toggle-eye">
                            <svg id="eye-icon" style="width:18px;height:18px;fill:currentColor;" viewBox="0 0 24 24">
                                <path
                                    d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" />
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login-submit" id="btn-login">
                    <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24">
                        <path
                            d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z" />
                    </svg>
                    Masuk ke Sistem
                </button>
            </form>

            <div class="login-card-footer">
                <a href="landing.html" class="login-back-link">
                    <svg style="width:14px;height:14px;fill:currentColor;" viewBox="0 0 24 24">
                        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
                    </svg>
                    Kembali ke Beranda
                </a>
                <div class="login-app-note">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z" />
                    </svg>
                    Portal Resmi & Akses Terenkripsi
                </div>
            </div>
        </div>
    </div>

    <script src="assets/js/config.js?v=20261126"></script>
    <script src="assets/js/api.js?v=20261126"></script>
    <script>
        const API_BASE_URL_LOCAL = resolveBackendBase("../backend/api");

        function getSavedTheme() {
            const saved = localStorage.getItem('app_theme');
            if (saved === 'dark' || saved === 'light') return saved;
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) return 'dark';
            return 'light';
        }

        function updateThemeLoginUI(theme) {
            const btn = document.getElementById('theme-toggle');
            if (!btn) return;
            const isDark = theme === 'dark';
            btn.setAttribute('aria-label', isDark ? 'Beralih ke mode terang' : 'Beralih ke mode gelap');
            btn.setAttribute('title', isDark ? 'Beralih ke mode terang' : 'Beralih ke mode gelap');
            if (isDark) {
                btn.innerHTML = `<svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`;
            } else {
                btn.innerHTML = `<svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;
            }
        }

        function toggleThemeLogin() {
            const current = document.documentElement.getAttribute('data-theme') || getSavedTheme();
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.classList.add('theme-transition');
            setTimeout(() => document.documentElement.classList.remove('theme-transition'), 300);
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('app_theme', next);
            updateThemeLoginUI(next);
        }

        updateThemeLoginUI(document.documentElement.getAttribute('data-theme') || getSavedTheme());

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById("password");
            const eyeIcon = document.getElementById("eye-icon");
            if (pwdInput.type === "password") {
                pwdInput.type = "text";
                eyeIcon.innerHTML = `<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>`;
            } else {
                pwdInput.type = "password";
                eyeIcon.innerHTML = `<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z" />`;
            }
        }

        document.getElementById("login-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("btn-login");
            const alertBox = document.getElementById("alert-box");
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value.trim();

            btn.disabled = true;
            btn.innerHTML = `<svg style="width:16px;height:16px;fill:currentColor;animation:spin 1s linear infinite;" viewBox="0 0 24 24"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/></svg> Memproses...`;

            const res = await apiCall("auth.php?action=login", "POST", { username, password }, API_BASE_URL_LOCAL);

            btn.disabled = false;
            btn.innerHTML = `<svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24"><path d="M11 7L9.6 8.4l2.6 2.6H2v2h10.2l-2.6 2.6L11 17l5-5-5-5zm9 12h-8v2h8c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2h-8v2h8v14z"/></svg> Masuk ke Sistem`;

            if (!res.success) {
                showAlert(alertBox, res.message || "Login gagal. Periksa kembali Username/NIP dan Password Anda.");
                return;
            }

            showCenterFeedback("Login berhasil! Mengalihkan ke dashboard...", "success", 1500);
            setTimeout(() => {
                window.location.href = res.data.role === "pegawai" ? "pegawai/dashboard.html" : "admin/dashboard.html";
            }, 350);
        });

        // Jika sudah login, redirect otomatis. Jika belum, tetap ambil csrf_token awal untuk form login.
        (async () => {
            const res = await apiCall("auth.php?action=me", "GET", null, API_BASE_URL_LOCAL);
            if (res.success) {
                window.location.href = res.data.role === "pegawai" ? "pegawai/dashboard.html" : "admin/dashboard.html";
            }
        })();
    </script>
</body>

</html>
