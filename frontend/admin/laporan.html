<!DOCTYPE html>
<html lang="id">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetak Laporan Penilaian - Sistem Penilaian 360</title>
    <script>
    (function(){
        var t = localStorage.getItem('app_theme');
        if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
        }
        var isNav = sessionStorage.getItem('sidebar_nav_open') === '1' || sessionStorage.getItem('sidebar_hovered') === '1';
        if (isNav && localStorage.getItem('sidebar_pinned') !== '1') {
            document.documentElement.classList.add('sidebar-nav-open', 'sidebar-hover-persisted');
            function onMove(e) {
                if (e.clientX > 248) {
                    document.documentElement.classList.remove('sidebar-nav-open', 'sidebar-hover-persisted');
                    sessionStorage.removeItem('sidebar_nav_open');
                    sessionStorage.removeItem('sidebar_hovered');
                    window.removeEventListener('mousemove', onMove);
                }
            }
            window.addEventListener('mousemove', onMove, { passive: true });
        }
    })();
    </script>
    <link rel="stylesheet" href="../assets/css/style.css?v=20261125_laporan">
    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <style>.sidebar-footer, .sidebar-toggle-bottom, button.sidebar-toggle-bottom, aside#sidebar .sidebar-footer, aside#sidebar .sidebar-toggle-bottom { display: none !important; }</style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar no-print" id="sidebar"></aside>
    <div class="main-content">
        <header class="topbar no-print">
            <div class="topbar-left">
                <h1 id="page-title">Cetak Laporan</h1>
            </div>
            <div id="topbar-user"></div>
        </header>
        <main class="page">
            <div class="card no-print">
                <div class="form-row" style="align-items:flex-end;">
                    <div>
                        <label>Pilih Periode</label>
                        <select id="select-periode"></select>
                    </div>
                    <div>
                        <label>Unit Kerja / Induk</label>
                        <select id="select-unit-induk" onchange="onUnitIndukChange()">
                            <option value="">Semua Unit Induk</option>
                        </select>
                    </div>
                    <div>
                        <label>Sub Unit / Seksi / Subbag</label>
                        <select id="select-unit" onchange="onSubUnitChange()" disabled>
                            <option value="">Semua Sub Unit / Seksi</option>
                        </select>
                    </div>
                    <div style="flex:none; display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap;">
                        <button class="btn btn-primary" onclick="downloadPdf()" title="Unduh format PDF instansi resmi" style="display:inline-flex; align-items:center; gap:6px; font-weight:600; background:#1B4F8C;">
                            <svg style="width:14px;height:14px;fill:currentColor;" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                            Unduh PDF
                        </button>
                        <button class="btn btn-secondary" onclick="downloadCsv()" style="display:inline-flex; align-items:center; gap:6px; font-weight:600;">
                            <svg style="width:14px;height:14px;fill:currentColor;" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
                            Unduh CSV
                        </button>
                    </div>
                </div>
            </div>

            <div class="card" id="report-card">
                <div class="flex-between mb-16" style="flex-wrap:wrap; gap:8px;">
                    <div>
                        <div class="card-title" style="margin-bottom:2px;">Rekapitulasi Laporan Penilaian Kinerja 360&deg;</div>
                        <div class="text-muted" id="report-periode-subtitle" style="font-size:12.5px;">Pilih periode untuk menampilkan laporan.</div>
                    </div>
                </div>

                <!-- Filter & Paging Toolbar (Screen only) -->
                <div class="no-print" id="report-toolbar" style="display:none; margin-bottom:16px; gap:10px; align-items:center; flex-wrap:wrap; justify-content:space-between;">
                    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; flex:1;">
                        <input type="text" id="report-search" placeholder="Cari nama pegawai, NIP, atau jabatan..." oninput="onReportSearchInput()" style="min-width:240px; flex:1; max-width:360px; padding:8px 12px; border:1px solid var(--border); border-radius:8px; font-size:13px; background:var(--card-bg); color:var(--text);">
                    </div>

                    <div style="font-size:12.5px; color:var(--text-muted);" id="report-total-info">
                        Total: 0 pegawai
                    </div>
                </div>

                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th style="width:40px; text-align:center;">No</th>
                                <th>Pegawai</th>
                                <th>Jabatan</th>
                                <th>Unit Kerja</th>
                                <th style="text-align:center; width:85px;">Diri Sendiri</th>
                                <th style="text-align:center; width:80px;">Atasan</th>
                                <th style="text-align:center; width:85px;">Rekan Kerja</th>
                                <th style="text-align:center; width:80px;">Bawahan</th>
                                <th style="text-align:center; width:90px;">Skor Akhir</th>
                                <th style="text-align:center; width:115px;">Predikat</th>
                                <th class="no-print" style="text-align:center; width:85px;">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="report-tbody">
                            <tr><td colspan="11" class="text-muted" style="text-align:center; padding:24px;">Pilih periode untuk menampilkan laporan.</td></tr>
                        </tbody>
                    </table>
                </div>

                <!-- Paging Controls Container -->
                <div id="pagination-laporan" class="no-print" style="margin-top:16px;"></div>
            </div>
        </main>
    </div>
</div>

<script src="../assets/js/config.js?v=20261126"></script>
<script src="../assets/js/api.js?v=20261126"></script>
<script src="../assets/js/searchable-select.js?v=20261116_search"></script>
<script src="../assets/js/auth.js?v=20261117_notif"></script>
<script>
function escapeHtml(str) {
    if (!str) return '';
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

let currentPeriodeId = null;
let currentUnitId = '';
let currentPeriodeData = null;

let allReportRows = [];
let filteredReportRows = [];
let reportPage = 1;
const PAGE_LIMIT = 20;
let reportSearchQuery = '';
let reportSearchTimeout = null;

let allUnits = [];

async function loadUnitOptions() {
    const res = await apiCall("unit_kerja.php");
    if (!res.success) return;
    allUnits = res.data;

    const parentUnits = allUnits.filter(u => u.parent_id === null || u.parent_id == 1 || ['dinas','sekretariat','bidang','upt','upt_lab'].includes(u.jenis_unit));
    const dinasSekr = parentUnits.filter(u => ['dinas','sekretariat'].includes(u.jenis_unit));
    const bidangList = parentUnits.filter(u => u.jenis_unit === 'bidang');
    const uptList = parentUnits.filter(u => ['upt','upt_lab'].includes(u.jenis_unit));

    let html = '<option value="">Semua Unit Induk</option>';
    if (dinasSekr.length) {
        html += `<optgroup label="Dinas & Sekretariat">${dinasSekr.map(u => `<option value="${u.id}">${u.nama_unit}</option>`).join('')}</optgroup>`;
    }
    if (bidangList.length) {
        html += `<optgroup label="Bidang">${bidangList.map(u => `<option value="${u.id}">${u.nama_unit}</option>`).join('')}</optgroup>`;
    }
    if (uptList.length) {
        html += `<optgroup label="UPT">${uptList.map(u => `<option value="${u.id}">${u.nama_unit}</option>`).join('')}</optgroup>`;
    }
    const selInduk = document.getElementById("select-unit-induk");
    selInduk.innerHTML = html;
    if (window.SearchableSelect && window.SearchableSelect.sync) {
        window.SearchableSelect.sync(selInduk);
    }
}

function onUnitIndukChange() {
    const indukId = document.getElementById("select-unit-induk").value;
    const subSelect = document.getElementById("select-unit");
    if (!indukId) {
        subSelect.innerHTML = '<option value="">Semua Sub Unit / Seksi</option>';
        subSelect.disabled = true;
        subSelect.value = '';
        currentUnitId = '';
    } else {
        const children = allUnits.filter(u => u.parent_id == indukId);
        if (children.length === 0) {
            subSelect.innerHTML = '<option value="">(Tidak ada sub bidang/seksi)</option>';
            subSelect.disabled = true;
            subSelect.value = '';
        } else {
            subSelect.innerHTML = '<option value="">Semua Sub Unit di Unit Ini</option>' +
                children.map(c => `<option value="${c.id}">${c.nama_unit}</option>`).join('');
            subSelect.disabled = false;
        }
        currentUnitId = indukId;
    }
    if (window.SearchableSelect && window.SearchableSelect.sync) {
        window.SearchableSelect.sync(subSelect);
    }
    loadReport(currentPeriodeId);
}

function onSubUnitChange() {
    const subVal = document.getElementById("select-unit").value;
    const indukVal = document.getElementById("select-unit-induk").value;
    currentUnitId = subVal || indukVal || '';
    loadReport(currentPeriodeId);
}

async function loadPeriodOptions() {
    const res = await apiCall("periode.php");
    const select = document.getElementById("select-periode");
    if (!res.success || res.data.length === 0) { select.innerHTML = `<option value="">Belum ada periode</option>`; return; }
    select.innerHTML = res.data.map(p => `<option value="${p.id}">${p.nama_periode}</option>`).join("");
    select.addEventListener("change", () => {
        currentPeriodeId = select.value;
        loadReport(currentPeriodeId);
    });
    currentPeriodeId = select.value;
    if (window.SearchableSelect && window.SearchableSelect.sync) {
        window.SearchableSelect.sync(select);
    }
    loadReport(currentPeriodeId);
}

async function loadReport(periodeId) {
    const tbody = document.getElementById("report-tbody");
    const toolbar = document.getElementById("report-toolbar");
    const subtitle = document.getElementById("report-periode-subtitle");

    if (!periodeId) { 
        subtitle.textContent = "Pilih periode untuk menampilkan laporan.";
        toolbar.style.display = "none";
        tbody.innerHTML = `<tr><td colspan="11" class="text-muted" style="text-align:center; padding:24px;">Pilih periode untuk menampilkan laporan.</td></tr>`;
        renderPagination(null, 'pagination-laporan', () => {});
        return; 
    }

    tbody.innerHTML = `<tr><td colspan="11" class="text-muted" style="text-align:center; padding:32px;">
        <div style="display:inline-block; width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin 0.8s linear infinite;"></div>
        <div style="margin-top:10px; font-size:13px;">Memuat data laporan...</div>
    </td></tr>`;

    let url = `reports.php?periode_id=${periodeId}`;
    if (currentUnitId) url += `&unit_kerja_id=${currentUnitId}`;
    const res = await apiCall(url);
    if (!res.success) { 
        tbody.innerHTML = `<tr><td colspan="11" class="text-muted" style="text-align:center; padding:24px;">${escapeHtml(res.message)}</td></tr>`;
        toolbar.style.display = "none";
        return; 
    }

    currentPeriodeData = res.data.periode;
    allReportRows = res.data.laporan || [];

    let pName = String(currentPeriodeData.nama_periode || '').trim();
    pName = pName.replace(/^Penilaian\s+Penilaian/i, 'Penilaian');
    pName = pName.replace(/^Periode:\s*/i, '');
    subtitle.textContent = `Periode: ${pName} (${formatDate(currentPeriodeData.tanggal_mulai)} s/d ${formatDate(currentPeriodeData.tanggal_selesai)})`;
    toolbar.style.display = "flex";

    reportPage = 1;
    applyReportFilters();
}

function onReportSearchInput() {
    clearTimeout(reportSearchTimeout);
    reportSearchTimeout = setTimeout(() => {
        reportSearchQuery = (document.getElementById("report-search").value || '').toLowerCase().trim();
        reportPage = 1;
        applyReportFilters();
    }, 250);
}

function applyReportFilters() {
    let rows = allReportRows || [];
    if (reportSearchQuery) {
        rows = rows.filter(r => {
            const nama = (r.nama || '').toLowerCase();
            const nip = (r.nip || '').toLowerCase();
            const jab = (r.jabatan || '').toLowerCase();
            const unit = (r.unit_kerja || '').toLowerCase();
            const gol = (r.golongan || '').toLowerCase();
            return nama.includes(reportSearchQuery) || nip.includes(reportSearchQuery) || jab.includes(reportSearchQuery) || unit.includes(reportSearchQuery) || gol.includes(reportSearchQuery);
        });
    }
    filteredReportRows = rows;
    renderReportView();
}

function renderReportView() {
    const tbody = document.getElementById("report-tbody");
    const totalInfo = document.getElementById("report-total-info");

    const total = filteredReportRows.length;
    totalInfo.innerHTML = `Total: <strong>${total}</strong> pegawai dinilai`;

    if (total === 0) {
        tbody.innerHTML = `<tr><td colspan="11" class="text-muted" style="text-align:center; padding:24px;">Tidak ada data laporan yang cocok dengan filter.</td></tr>`;
        renderPagination(null, 'pagination-laporan', () => {});
        return;
    }

    const totalPages = Math.ceil(total / PAGE_LIMIT) || 1;

    if (reportPage > totalPages) reportPage = totalPages;
    if (reportPage < 1) reportPage = 1;

    const offset = (reportPage - 1) * PAGE_LIMIT;
    const pageRows = filteredReportRows.slice(offset, offset + PAGE_LIMIT);

    tbody.innerHTML = pageRows.map((r, i) => {
        const no = offset + i + 1;
        const skorAkhir = (r.skor_akhir !== '-' && r.skor_akhir !== null && r.skor_akhir !== undefined)
            ? (isNaN(Number(r.skor_akhir)) ? r.skor_akhir : Number(r.skor_akhir).toFixed(2))
            : '-';

        return `<tr>
            <td style="text-align:center; color:var(--text-muted); font-size:12.5px;">${no}</td>
            <td>
                <div style="font-weight:600; color:var(--text); display:flex; align-items:center; gap:6px;">
                    <span>${escapeHtml(r.nama)}</span>
                    ${r.golongan && r.golongan !== '-' ? `<span class="badge" style="font-size:10px;padding:1px 6px;background:var(--primary-light);color:var(--primary);border-radius:10px;font-weight:600;">${escapeHtml(r.golongan)}</span>` : ''}
                </div>
                ${r.nip ? `<div style="font-size:11px; color:var(--text-muted); margin-top:2px;">NIP: ${escapeHtml(r.nip)}</div>` : ''}
            </td>
            <td style="font-size:12.5px;">${escapeHtml(r.jabatan || '-')}</td>
            <td style="font-size:12.5px; color:var(--text-secondary);">${escapeHtml(r.unit_kerja || '-')}</td>
            <td style="text-align:center;">${r.skor_diri ?? '-'}</td>
            <td style="text-align:center;">${r.skor_atasan ?? '-'}</td>
            <td style="text-align:center;">${r.skor_rekan ?? '-'}</td>
            <td style="text-align:center;">${r.skor_bawahan ?? '-'}</td>
            <td style="text-align:center;"><strong>${skorAkhir}</strong></td>
            <td style="text-align:center;">${predikatBadge(r.predikat)}</td>
            <td class="no-print" style="text-align:center;">
                <button class="btn btn-secondary btn-sm" onclick="cetakLaporanPegawai(${r.id})" title="Cetak Laporan Pegawai" style="padding:4px 9px; font-size:11.5px; display:inline-flex; align-items:center; gap:4px; white-space:nowrap;">
                    <svg style="width:12px;height:12px;fill:currentColor;" viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
                    Cetak
                </button>
            </td>
        </tr>`;
    }).join("");

    // Render pagination controls
    if (totalPages > 1) {
        const meta = { total, page: reportPage, limit: PAGE_LIMIT, totalPages };
        renderPagination(meta, 'pagination-laporan', (newPage) => {
            reportPage = newPage;
            renderReportView();
            const card = document.getElementById("report-card");
            if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
    } else {
        renderPagination(null, 'pagination-laporan', () => {});
    }
}

function cetakLaporanPegawai(pegawaiId) {
    if (!currentPeriodeId) { showCenterFeedback("Pilih periode terlebih dahulu.", "warning"); return; }
    window.open(`cetak_pegawai.html?periode_id=${currentPeriodeId}&pegawai_id=${pegawaiId}`, '_blank');
}

function downloadCsv() {
    if (!currentPeriodeId) { showCenterFeedback("Pilih periode terlebih dahulu.", "warning"); return; }
    let url = getApiUrl(`reports.php?periode_id=${currentPeriodeId}&format=csv`);
    if (currentUnitId) url += `&unit_kerja_id=${currentUnitId}`;
    window.open(url, "_blank");
}

function downloadPdf() {
    if (!currentPeriodeId) { showCenterFeedback("Pilih periode terlebih dahulu.", "warning"); return; }
    let url = getApiUrl(`reports.php?periode_id=${currentPeriodeId}&format=pdf`);
    if (currentUnitId) url += `&unit_kerja_id=${currentUnitId}`;
    window.open(url, "_blank");
}

(async () => {
    const user = await initLayout("laporan", ["super_admin", "admin"]);
    if (!user) return;
    await loadUnitOptions();
    await loadPeriodOptions();
})();
</script>
</body>
</html>
