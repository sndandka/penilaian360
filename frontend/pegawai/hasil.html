        (function () {
            var t = localStorage.getItem('app_theme');
            if (t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
            }
            var isNav = sessionStorage.getItem('sidebar_nav_open') === '1' || sessionStorage.getItem('sidebar_hovered') === '1';
            if (isNav && localStorage.getItem('sidebar_pinned') !== '1' && window.innerWidth > 768) {
                document.documentElement.classList.add('sidebar-nav-open', 'sidebar-hover-persisted');
                function onMove(e) {
                    if (e.clientX > 248) {
                        document.documentElement.classList.remove('sidebar-nav-open', 'sidebar-hover-persisted');
                        sessionStorage.removeItem('sidebar_nav_open');
                        sessionStorage.removeItem('sidebar_hovered');
                        window.removeEventListener('mousemove', onMove);
                    }
                }
                window.addEventListener('mousemove', onMove, { passive: true });
            }
        })();
    </script>

        .rincian-ind-wrap {

            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;

    <script src="../assets/js/auth.js?v=20261125_mobile_v3"></script>
    <script>
        let currentHasilData = null;
        let currentSelectedPeriodeId = null;

        function formatNamaLengkap(p) {
            if (!p) return '-';
            let nama = (p.nama_lengkap || '').trim();
            const depan = (p.gelar_depan || '').trim();
            const belakang = (p.gelar_belakang || '').trim();
            if (depan && !nama.toLowerCase().startsWith(depan.toLowerCase())) {
                nama = `${depan} ${nama}`;
            }
            if (belakang && !nama.toLowerCase().includes(belakang.toLowerCase())) {
                nama = `${nama}, ${belakang}`;
            }
            return nama;
        }

        function formatPangkatGolongan(gol) {
            if (!gol) return '-';
            const g = gol.trim();
            const pangkatMap = {
                'I/a': 'Juru Muda', 'I/b': 'Juru Muda Tk. I', 'I/c': 'Juru', 'I/d': 'Juru Tk. I',
                'II/a': 'Pengatur Muda', 'II/b': 'Pengatur Muda Tk. I', 'II/c': 'Pengatur', 'II/d': 'Pengatur Tk. I',
                'III/a': 'Penata Muda', 'III/b': 'Penata Muda Tk. I', 'III/c': 'Penata', 'III/d': 'Penata Tk. I',
                'IV/a': 'Pembina', 'IV/b': 'Pembina Tk. I', 'IV/c': 'Pembina Utama Muda', 'IV/d': 'Pembina Utama Madya', 'IV/e': 'Pembina Utama'
            };
            return pangkatMap[g] ? `${pangkatMap[g]} (${g})` : g;
        }

        function cetakHasilPDF(pId) {
            const id = pId || currentSelectedPeriodeId || document.getElementById("select-periode").value;
            if (!id) {
                alert("Pilih periode penilaian terlebih dahulu.");
                return;
            }
            window.open(`cetak_hasil.html?periode_id=${id}`, '_blank');
        }

        function exportHasilExcel() {
            if (!currentHasilData) {
                alert("Data hasil penilaian belum tersedia untuk diunduh.");
                return;
            }
            const d = currentHasilData;
            const p = d.pegawai || {};
            const h = d.hasil || {};
            const per = d.periode || {};
            const hasBawahan = Boolean(d.has_bawahan);
            const bobotPakai = d.bobot_digunakan || {};
            const bobot = d.bobot_config || {};
            const hasCalc = h.nilai_akhir !== null && h.nilai_akhir !== undefined && h.tanggal_hitung;
            const sumPakai = (Number(bobotPakai.atasan) || 0) + (Number(bobotPakai.rekan) || 0) + (Number(bobotPakai.bawahan) || 0) + (Number(bobotPakai.diri) || 0);
            const useActualWeights = Boolean(hasCalc && sumPakai > 0);

            const bAtasan = useActualWeights ? (bobotPakai.atasan ?? 0) : (hasBawahan ? (bobot.bobot_atasan ?? 50) : (bobot.bobot_pelaksana_atasan ?? 50));
            const bRekan = useActualWeights ? (bobotPakai.rekan ?? 0) : (hasBawahan ? (bobot.bobot_rekan ?? 15) : (bobot.bobot_pelaksana_rekan ?? 40));
            const bBawahan = useActualWeights ? (bobotPakai.bawahan ?? 0) : (hasBawahan ? (bobot.bobot_bawahan ?? 25) : 0);
            const bDiri = useActualWeights ? (bobotPakai.diri ?? 0) : (hasBawahan ? (bobot.bobot_diri_sendiri ?? 10) : (bobot.bobot_pelaksana_diri_sendiri ?? bobot.bobot_diri_sendiri ?? 10));

            const escapeCsv = (str) => {
                if (str === null || str === undefined) return '""';
                const s = String(str).replace(/"/g, '""');
                return `"${s}"`;
            };

            const formatScore = (val) => {
                if (val === null || val === undefined || isNaN(val)) return '-';
                return Number(val).toFixed(2);
            };

            let csv = [];
            csv.push([escapeCsv("LAPORAN HASIL PENILAIAN KINERJA 360 DERAJAT")]);
            csv.push([escapeCsv("DINAS PEKERJAAN UMUM BINA MARGA PROVINSI JAWA TIMUR")]);
            csv.push([]);
            csv.push([escapeCsv("I. IDENTITAS PEGAWAI")]);
            csv.push([escapeCsv("Nama Lengkap"), escapeCsv(formatNamaLengkap(p))]);
            csv.push([escapeCsv("NIP"), escapeCsv(p.nip || '-')]);
            csv.push([escapeCsv("Jabatan"), escapeCsv(p.jabatan || '-')]);
            csv.push([escapeCsv("Unit Kerja"), escapeCsv(p.unit_kerja || '-')]);
            csv.push([escapeCsv("Pangkat / Golongan"), escapeCsv(formatPangkatGolongan(p.golongan_ruang))]);
            csv.push([escapeCsv("Kategori Penilaian"), escapeCsv(hasBawahan ? "Pejabat Struktural (Manajerial)" : "Pegawai Pelaksana / Fungsional")]);
            csv.push([escapeCsv("Periode Penilaian"), escapeCsv(`${per.nama_periode || '-'} (${per.tanggal_mulai || ''} s/d ${per.tanggal_selesai || ''})`)]);
            csv.push([escapeCsv("Tanggal Ekspor"), escapeCsv(new Date().toLocaleString("id-ID"))]);
            csv.push([]);

            csv.push([escapeCsv("II. REKAPITULASI CAPAIAN SKOR 360 DERAJAT")]);
            csv.push([
                escapeCsv("Relasi Penilai"),
                escapeCsv("Bobot (%)"),
                escapeCsv("Skor Diperoleh"),
                escapeCsv("Skala Maksimal")
            ]);
            csv.push([escapeCsv("Atasan"), escapeCsv(bAtasan + "%"), escapeCsv(formatScore(h.nilai_atasan)), escapeCsv("100")]);
            csv.push([escapeCsv("Rekan Kerja"), escapeCsv(bRekan + "%"), escapeCsv(formatScore(h.nilai_rekan)), escapeCsv("100")]);
            if (hasBawahan) {
                csv.push([escapeCsv("Bawahan"), escapeCsv(bBawahan + "%"), escapeCsv(formatScore(h.nilai_bawahan)), escapeCsv("100")]);
            } else {
                csv.push([escapeCsv("Bawahan"), escapeCsv("N/A"), escapeCsv("N/A"), escapeCsv("N/A")]);
            }
            csv.push([escapeCsv("Diri Sendiri"), escapeCsv(bDiri + "%"), escapeCsv(formatScore(h.nilai_diri)), escapeCsv("100")]);
            csv.push([escapeCsv("SKOR AKHIR TERBOBOT"), escapeCsv("100%"), escapeCsv(h.nilai_akhir !== null && h.nilai_akhir !== undefined ? Number(h.nilai_akhir).toFixed(2) : '-'), escapeCsv("100")]);
            csv.push([escapeCsv("PREDIKAT KINERJA"), escapeCsv("-"), escapeCsv(h.predikat || '-'), escapeCsv("-")]);
            csv.push([]);

            csv.push([escapeCsv("III. RINCIAN CAPAIAN PER KRITERIA PENILAIAN")]);
            csv.push([
                escapeCsv("No"),
                escapeCsv("Kode Kategori"),
                escapeCsv("Kriteria Penilaian"),
                escapeCsv("Jumlah Instrumen"),
                escapeCsv("Skor Atasan"),
                escapeCsv("Skor Rekan"),
                escapeCsv("Skor Bawahan"),
                escapeCsv("Skor Diri"),
                escapeCsv("Rata-rata Skor (Skala 5)"),
                escapeCsv("Capaian (%)"),
                escapeCsv("Predikat")
            ]);

            const rincian = d.rincian_indikator || [];
            let no = 1;
            rincian.forEach(kat => {
                const jml = kat.total_pertanyaan || (hasBawahan ? (kat.kode_kategori === 'KEP' ? 5 : 3) : 4);
                const skorAtasan = kat.skor_relasi ? kat.skor_relasi.atasan : null;
                const skorRekan  = kat.skor_relasi ? kat.skor_relasi.rekan : null;
                const skorBawahan= kat.skor_relasi ? kat.skor_relasi.bawahan : null;
                const skorDiri   = kat.skor_relasi ? kat.skor_relasi.diri : null;

                csv.push([
                    escapeCsv(no++),
                    escapeCsv(kat.kode_kategori || ''),
                    escapeCsv(kat.nama_kategori || ''),
                    escapeCsv(jml + " Butir"),
                    escapeCsv(formatScore(skorAtasan)),
                    escapeCsv(formatScore(skorRekan)),
                    escapeCsv(hasBawahan ? formatScore(skorBawahan) : "N/A"),
                    escapeCsv(formatScore(skorDiri)),
                    escapeCsv(formatScore(kat.rata_skor)),
                    escapeCsv(kat.persentase !== null ? kat.persentase + "%" : "-"),
                    escapeCsv(kat.predikat || "-")
                ]);
            });
            csv.push([]);

            // Komentar
            const allComments = [];
            (d.detail_penilai || []).forEach(dp => {
                if (dp.komentar_masukan && dp.komentar_masukan.trim() !== '') {
                    allComments.push(dp.komentar_masukan.trim());
                }
                (dp.jawaban || []).forEach(j => {
                    if (j.komentar && j.komentar.trim() !== '') {
                        allComments.push(j.komentar.trim());
                    }
                });
            });

            csv.push([escapeCsv("IV. CATATAN DAN MASUKAN PENGEMBANGAN KOMPETENSI (ANONIM)")]);
            if (allComments.length === 0) {
                csv.push([escapeCsv("Tidak ada catatan atau masukan dari penilai pada periode ini.")]);
            } else {
                allComments.forEach((c, idx) => {
                    csv.push([escapeCsv((idx + 1) + ". " + c)]);
                });
            }

            const csvContent = "\uFEFF" + csv.map(row => row.join(";")).join("\r\n");
            const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            const cleanNama = (p.nama_lengkap || 'Pegawai').replace(/[^a-zA-Z0-9_-]/g, '_');
            const cleanPeriode = (per.nama_periode || 'Periode').replace(/[^a-zA-Z0-9_-]/g, '_');
            link.setAttribute("href", url);
            link.setAttribute("download", `Hasil_Penilaian_360_${p.nip || 'NIP'}_${cleanNama}_${cleanPeriode}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        async function loadPeriodOptions() {
            const res = await apiCall("periode.php");
            const select = document.getElementById("select-periode");
            if (!res.success || res.data.length === 0) { select.innerHTML = `<option value="">Belum ada periode</option>`; return; }
            const relevant = res.data.filter(p => p.status !== 'draft');
            if (relevant.length === 0) { select.innerHTML = `<option value="">Belum ada periode aktif</option>`; return; }
            select.innerHTML = `<option value="">-- Pilih Periode --</option>` + relevant.map(p => {
                const cleanName = (p.nama_periode || '').replace(/^Penilaian\s+Penilaian/i, 'Penilaian');
                return `<option value="${p.id}">${cleanName}</option>`;
            }).join("");
            const aktif = relevant.filter(p => p.status === 'aktif');
            if (aktif.length > 0) { aktif.sort((a, b) => new Date(b.tanggal_mulai) - new Date(a.tanggal_mulai)); select.value = aktif[0].id; }
            select.addEventListener("change", () => loadResult(select.value));
            loadResult(select.value);
        }

        async function loadResult(periodeId) {
            currentSelectedPeriodeId = periodeId;
            const container = document.getElementById("result-container");
            const topBtns = document.getElementById("top-action-btns");

            if (!periodeId) {
                currentHasilData = null;
                if (topBtns) topBtns.style.display = "none";
                container.innerHTML = `
                <div class="card" style="padding:48px 24px; text-align:center;">
                    <div style="width:68px; height:68px; margin:0 auto 16px auto; background:rgba(59,130,246,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--primary);">
                        <svg style="width:34px; height:34px; fill:currentColor;" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7v-5z"/></svg>
                    </div>
                    <h3 style="margin:0 0 8px 0; font-size:18px; font-weight:700; color:var(--text);">Pilih Periode Penilaian</h3>
                    <p style="margin:0 auto; max-width:480px; font-size:13.5px; color:var(--text-secondary); line-height:1.55;">
                        Silakan tentukan periode penilaian di atas untuk meninjau rekapitulasi capaian skor kinerja 360&deg; Anda.
                    </p>
                </div>`;
                return;
            }
            container.innerHTML = `<div class="card"><div class="empty-state" style="padding:32px;"><p>Memuat data penilaian...</p></div></div>`;

            const res = await apiCall(`results.php?periode_id=${periodeId}`);
            if (!res.success) {
                currentHasilData = null;
                if (topBtns) topBtns.style.display = "none";
                container.innerHTML = `
                <div class="card" style="padding:40px 24px; text-align:center;">
                    <div style="width:64px; height:64px; margin:0 auto 16px auto; background:rgba(239,68,68,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--danger);">
                        <svg style="width:32px; height:32px; fill:currentColor;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                    </div>
                    <h3 style="margin:0 0 8px 0; font-size:17px; font-weight:700; color:var(--text);">Tidak Dapat Memuat Data</h3>
                    <p style="margin:0 auto; max-width:480px; font-size:13px; color:var(--text-secondary);">${res.message || 'Terjadi kendala saat mengambil data penilaian.'}</p>
                </div>`;
                return;
            }

            const d = res.data;
            if (!d.detail_penilai || d.detail_penilai.length === 0) {
                currentHasilData = null;
                if (topBtns) topBtns.style.display = "none";
                container.innerHTML = `
                <div class="card" style="padding:48px 24px; text-align:center;">
                    <div style="width:72px; height:72px; margin:0 auto 18px auto; background:rgba(59,130,246,0.1); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--primary);">
                        <svg style="width:36px; height:36px; fill:currentColor;" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
                    </div>
                    <h3 style="margin:0 0 8px 0; font-size:18px; font-weight:700; color:var(--text);">Hasil Penilaian Belum Tersedia</h3>
                    <p style="margin:0 auto 20px auto; max-width:540px; font-size:13.5px; color:var(--text-secondary); line-height:1.6;">
                        Hasil penilaian Anda untuk periode ini belum tersedia. Skor akan terhitung otomatis oleh sistem setelah penilai mengirimkan evaluasi final pada periode ini.
                    </p>
                    <div style="display:inline-flex; align-items:center; gap:8px; padding:7px 16px; background:rgba(245,158,11,0.12); color:#B45309; border-radius:24px; font-size:12.5px; font-weight:600;">
                        <svg style="width:14px; height:14px; fill:currentColor;" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        Status: Dalam Proses Evaluasi Penilai / Belum Dihitung
                    </div>
                </div>`;
                return;
            }

            currentHasilData = d;
            if (topBtns) topBtns.style.display = "flex";

            const h = d.hasil || {};
            const bobotPakai = d.bobot_digunakan || {};
            const relasiOrder = Boolean(d.has_bawahan) ? ['atasan', 'rekan', 'bawahan', 'diri'] : ['atasan', 'rekan', 'diri'];
            const relasiVal = { atasan: h.nilai_atasan, rekan: h.nilai_rekan, bawahan: h.nilai_bawahan, diri: h.nilai_diri };
            let relasiHtml = relasiOrder.filter(rel => relasiVal[rel] !== null && relasiVal[rel] !== undefined).map(relasi => {
                const val = Number(relasiVal[relasi]).toFixed(2);
                const b = bobotPakai[relasi] !== undefined ? `${bobotPakai[relasi]}%` : '';
                const bBadge = b ? ` (Bobot ${b})` : '';
                return `
        <div class="stat-card-wrap">
            <div class="stat-icon-box blue"><svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
            <div class="stat-text"><div class="s-label">${relasiLabel(relasi)}${bBadge}</div><div class="s-value">${val} <span style="font-size:12px; font-weight:500; color:var(--text-muted);">/ 100</span></div></div>
        </div>
        `;
            }).join("");

            const allComments = [];
            (d.detail_penilai || []).forEach(dp => {
                if (dp.komentar_masukan && dp.komentar_masukan.trim() !== '') {
                    allComments.push(dp.komentar_masukan.trim());
                }
                (dp.jawaban || []).forEach(j => {
                    if (j.komentar && j.komentar.trim() !== '') {
                        allComments.push(j.komentar.trim());
                    }
                });
            });

            let detailHtml = "";
            if (allComments.length === 0) {
                detailHtml = `<div class="card mb-20" style="padding:16px; font-size:13px; color:var(--text-muted);">Tidak ada komentar atau masukan dari penilai.</div>`;
            } else {
                const MAX_COMMENTS = 5;
                // Acak komentar agar semakin sulit ditebak (opsional tapi baik untuk anonimitas)
                allComments.sort(() => Math.random() - 0.5);

                const commentItemHtml = c => `<div style="padding:12px 0; border-bottom:1px solid var(--border); font-size:13px; color:var(--text); font-style:italic;">"${c}"</div>`;
                const visibleHtml = allComments.slice(0, MAX_COMMENTS).map(commentItemHtml).join("");
                const hiddenHtml = allComments.length > MAX_COMMENTS
                    ? allComments.slice(MAX_COMMENTS).map(commentItemHtml).join("")
                    : "";
                const toggleId = `cmts-extra-${periodeId}`;
                const btnId = `cmts-btn-${periodeId}`;
                const toggleBtn = allComments.length > MAX_COMMENTS ? `
            <div id="${toggleId}" style="display:none;">${hiddenHtml}</div>
            <button id="${btnId}" class="btn btn-secondary btn-sm" style="margin-top:12px; font-size:12px;"
                onclick="(function(){
                    var el=document.getElementById('${toggleId}');
                    var btn=document.getElementById('${btnId}');
                    var expanded=el.style.display!=='none';
                    el.style.display=expanded?'none':'block';
                    btn.textContent=expanded?'Lihat semua komentar (${allComments.length})':'Sembunyikan komentar';
                })()">Lihat semua komentar (${allComments.length})</button>
        ` : "";
                detailHtml = `<div class="card mb-20" style="padding:16px;">${visibleHtml}${toggleBtn}</div>`;
            }

            let chartHtml = `
        <div class="card mb-20">
            <div class="card-title">
                <svg style="width:18px;height:18px;fill:var(--primary);" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                Perbandingan Skor Kategori per Relasi
            </div>
            <div class="hasil-chart-wrap">
                <canvas id="lineChart"></canvas>
            </div>
        </div>
    `;

            const rincianHtml = buildRincianIndikatorHtml(d.rincian_indikator, 'pegawai', { hasBawahan: d.has_bawahan, bobotDigunakan: bobotPakai });

            container.innerHTML = `
        ${d.pegawai ? `
        <div class="card mb-20" style="padding:14px 18px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;">
            <div>
                <div style="font-weight:700; font-size:15px; color:var(--text); display:flex; align-items:center; gap:8px;">
                    <span>${formatNamaLengkap(d.pegawai)}</span>
                    ${d.pegawai.golongan_ruang ? `<span class="badge" style="font-size:11px;padding:2px 8px;background:var(--primary-light);color:var(--primary);border-radius:12px;font-weight:600;">${d.pegawai.golongan_ruang}</span>` : ''}
                </div>
                <div style="font-size:12px; color:var(--text-muted); margin-top:2px;">
                    NIP: ${d.pegawai.nip || '-'} &bull; ${d.pegawai.jabatan || '-'} &bull; ${d.pegawai.unit_kerja || '-'}
                </div>
            </div>
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <div style="font-size:12px; font-weight:600; color:var(--primary); background:var(--bg); border:1px solid var(--border); padding:6px 12px; border-radius:6px;">
                    ${d.periode ? d.periode.nama_periode : ''}
                </div>
            </div>
        </div>
        ` : ''}
        <div class="card hasil-hero-card">
            <div class="hasil-hero-score">${h.nilai_akhir ?? '-'}</div>
            <div style="color:var(--text-muted); font-size:13px; margin-top:8px;">Skor Akhir 360&deg; Anda (skala 100, terbobot sesuai konfigurasi sistem)</div>
            <div style="margin-top:10px;">${predikatBadge(h.predikat)}</div>
        </div>
        ${chartHtml}
        <div class="grid grid-4 mb-20">${relasiHtml}</div>
        ${rincianHtml}
        <div style="font-size:16px; font-weight:600; color:var(--text); margin-top:24px; margin-bottom:12px;">Daftar Komentar dan Masukan dari Penilai</div>
        ${detailHtml}
    `;

            renderCharts(d);
        }

        let lineChartInstance = null;
        function renderCharts(d) {
            const style = getComputedStyle(document.body);
            const primary = style.getPropertyValue('--primary').trim() || '#1B4F8C';
            const success = style.getPropertyValue('--success').trim() || '#10B981';
            const warning = style.getPropertyValue('--warning').trim() || '#F59E0B';
            const purple = style.getPropertyValue('--purple').trim() || '#8B5CF6';
            const textColor = style.getPropertyValue('--text').trim() || '#1F2937';
            const textMuted = style.getPropertyValue('--text-muted').trim() || '#9CA3AF';
            const border = style.getPropertyValue('--border').trim() || '#E3E7ED';
            const relasiColors = { atasan: primary, rekan: warning, bawahan: success, diri: purple };

            const categories = new Set();
            const statsPerRelasi = {};
            d.detail_penilai.forEach(dp => {
                if (!statsPerRelasi[dp.jenis_relasi]) statsPerRelasi[dp.jenis_relasi] = {};
                (dp.jawaban || []).forEach(j => {
                    categories.add(j.nama_kategori);
                    if (!statsPerRelasi[dp.jenis_relasi][j.nama_kategori]) statsPerRelasi[dp.jenis_relasi][j.nama_kategori] = { sum: 0, count: 0 };
                    statsPerRelasi[dp.jenis_relasi][j.nama_kategori].sum += parseFloat(j.skor);
                    statsPerRelasi[dp.jenis_relasi][j.nama_kategori].count += 1;
                });
            });
            const categoryList = Array.from(categories);
            const datasets = [];
            for (const relasi in statsPerRelasi) {
                const dataPoints = categoryList.map(cat => {
                    const stats = statsPerRelasi[relasi][cat];
                    return stats && stats.count > 0 ? parseFloat((stats.sum / stats.count).toFixed(2)) : null;
                });
                datasets.push({ label: relasiLabel(relasi), data: dataPoints, borderColor: relasiColors[relasi] || primary, backgroundColor: relasiColors[relasi] || primary, borderWidth: 2, tension: 0.1, pointRadius: 4, spanGaps: true });
            }
            if (lineChartInstance) lineChartInstance.destroy();
            const ctx = document.getElementById('lineChart');
            if (categoryList.length > 0 && ctx && typeof Chart !== 'undefined') {
                const isMob = window.innerWidth <= 640;
                lineChartInstance = new Chart(ctx, {
                    type: 'line', data: { labels: categoryList, datasets: datasets },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        scales: {
                            y: { min: 0, max: 5, grid: { color: border }, ticks: { color: textMuted, font: { size: isMob ? 10 : 12 } } },
                            x: { grid: { display: false }, ticks: { color: textColor, maxRotation: isMob ? 35 : 0, font: { family: 'Inter', size: isMob ? 10 : 12 } } }
                        },
                        plugins: { legend: { display: true, labels: { color: textColor, font: { family: 'Inter', size: isMob ? 11 : 12 }, usePointStyle: true, boxWidth: 8, padding: isMob ? 10 : 14 } } }
                    }
                });
            } else if (ctx) {
                const msg = (typeof Chart === 'undefined' && categoryList.length > 0)
                    ? 'Grafik tidak tersedia (library Chart.js gagal dimuat)'
                    : 'Belum ada data kategori untuk ditampilkan';
                ctx.parentElement.innerHTML = `<div class="empty-state" style="padding:0;"><p>${msg}</p></div>`;
            }
        }

        (async () => {
            const user = await initLayout("hasil", ["pegawai"]);
            if (!user) return;
            loadPeriodOptions();
        })();
    </script>
</body>

</html>
